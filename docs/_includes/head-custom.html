{%- comment -%}
  Etiqueta de Google (gtag.js, Google Analytics), solo si el sitio se construyó con un ID (variable
  GOOGLE_TAG_ID del repositorio; ver .github/workflows/pages.yml). Sin ID no se carga nada.
{%- endcomment -%}
{%- if site.google_tag_id -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_tag_id | url_encode }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config',{{ site.google_tag_id | jsonify }});</script>
{%- endif -%}
